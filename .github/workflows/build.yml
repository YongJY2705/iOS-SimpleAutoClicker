name: Build SimpleAutoClicker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (kèm submodule ZSFakeTouch)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cài Theos
        run: |
          brew install ldid make
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build
        run: make package FINALPACKAGE=1

      - name: Gom file kết quả
        run: |
          mkdir -p out
          find .theos -name "SimpleAutoClicker.dylib" -exec cp {} out/ \;
          cp packages/*.deb out/ 2>/dev/null || true
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAutoClicker
          path: out/
